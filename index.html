  const cents=[];
  const cabe=(cx,cy)=>{
    if(cx-R<1||cy-R<1||cx+R>=N-1||cy+R>=N-1)return false;
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){if(BLOQ.has(m[(cy+dy)*N+cx+dx]))return false}
    return true;
  };
  // primeira vila: o lugar válido mais perto do centro (onde o jogador nasce)
  {
    const C=N>>1;let achou=null;
    for(let r=0;r<=30&&!achou;r++)for(let dy=-r;dy<=r&&!achou;dy++)for(let dx=-r;dx<=r&&!achou;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!=r)continue;
      if(cabe(C+dx,C+dy))achou=[C+dx,C+dy];
    }
    if(achou)cents.push(achou);
  }
  for(let n=0;n<3000&&cents.length<3;n++){
    const cx=(R+1+hash(n,7,s+500)*(N-2*R-2))|0, cy=(R+1+hash(n,8,s+500)*(N-2*R-2))|0;
    if(cents.some(([a,b])=>Math.hypot(a-cx,b-cy)<SEP))continue;
    if(cabe(cx,cy))cents.push([cx,cy]);
  }
  if(!cents.length)cents.push([N>>1,N>>1]);
  cents.forEach(([cx,cy],vi)=>{
    const T=TIPOS[(hash(vi+3,11,s)*TIPOS.length)|0];
    // limpa a área da vila
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
      const q=(cy+dy)*N+cx+dx,b=m[q];
      if(VEG.has(b)||b==8||b==9)m[q]=2;
    }
    // casas (quantidade depende do tipo)
    const TAM=[[4,4],[5,4],[4,5],[5,5]];
    HPOS.slice(0,T.casas).forEach(([ox,oy],hi)=>{
      const [W,H]=TAM[(hash(vi+7,hi,s)*TAM.length)|0];
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){
        const q=(cy+oy+y)*N+cx+ox+x;
        const borda=(x==0||x==W-1||y==0||y==H-1);
        m[q]=borda?75:76;
        VLJ.push([q,'J1']);
      }
      const dq=(cy+oy+H-1)*N+cx+ox+1;
      m[dq]=12;
      const bq=(cy+oy+1)*N+cx+ox+1, cq=(cy+oy+1)*N+cx+ox+2;
      m[bq]=11;
      const V=hi==0?'bau':['bau','vazia','forno','tapete'][(hash(vi+9,hi,s+3)*4)|0];
      if(V=='bau'){m[cq]=23;VCH.push([cq,T.loot[hi%T.loot.length]])}
      else if(V=='forno'){m[cq]=24}
      else if(V=='tapete'){m[cq]=41;m[cq+N]=41}
      for(let t=VLJ.length-1;t>=0;t--)if(VLJ[t][0]===dq)VLJ.splice(t,1);
    });
    m[cy*N+cx]=58; // tocha no centro
    m[(cy+3)*N+cx+4]=78; // poço
    // lago
    if(T.pond){
      const px=cx+10,py=cy+3;
      if(px+2<N-1&&py+2<N-1)for(let y=py;y<=py+2;y++)for(let x=px;x<=px+2;x++)m[y*N+x]=0;
    }
    // plantação
    if(T.plant){
      for(let fy=cy+3;fy<=cy+4;fy++)for(let fx=cx-7;fx<=cx-4;fx++){
        if(fx<1||fy<1||fx>=N-1||fy>=N-1)continue;
        const q=fy*N+fx;
        if(BLOQ.has(m[q]))m[q]=2;
        m[q]=15; VCR.push(q);
      }
    }
    // cercado com animais
    if(T.cerca){
      const px0=cx+8,py0=cy-3,px1=cx+12,py1=cy;
      if(px1<N-1&&py0>0&&py1<N-1){
        for(let y=py0;y<=py1;y++)for(let x=px0;x<=px1;x++)if(BLOQ.has(m[y*N+x]))m[y*N+x]=1;
        for(let y=py0;y<=py1;y++)for(let x=px0;x<=px1;x++){
          const edge=(x==px0||x==px1||y==py0||y==py1);
          m[y*N+x]=edge?25:2;
        }
        m[py1*N+px0+2]=26; // portão fechado (abre com a ação)
        const bichos=[['sheep',px0+1,py0+1],['pig',px0+3,py0+2],['cow',px0+2,py0+1]];
        for(const [t,x,y] of bichos)VAN.push({t,x:x*TS+3,y:y*TS+3,hp:12,mh:12,tm:0,vx:0,vy:0,f:1,pan:0});
      }
    }
    // árvores em volta (floresta)
    if(T.trees){
      for(const [dx,dy] of [[-10,5],[-11,4],[10,5],[11,-5],[-10,-6],[9,-9]]){
        const x=cx+dx,y=cy+dy;
        if(x<1||y<1||x>=N-1||y>=N-1)continue;
        if(!BLOQ.has(m[y*N+x]))m[y*N+x]=3;
      }
    }
    // moradores (2 a 3 por vila, em tiles livres perto da lanterna)
    const HP=[];
    const ok=(i,j)=>{const b=m[j*N+i];return !solid(b)&&b!=75&&b!=76&&b!=11&&b!=23&&b!=12&&b!=77};
    for(let r=1;r<=5&&HP.length<T.npcs;r++)for(let dy=-r;dy<=r&&HP.length<T.npcs;dy++)for(let dx=-r;dx<=r&&HP.length<T.npcs;dx++){
      const i=cx+dx,j=cy+dy;if(Math.max(Math.abs(dx),Math.abs(dy))!=r)continue;
      if(ok(i,j)&&!HP.some(([a,b])=>a==i&&b==j))HP.push([i,j]);
    }
    while(HP.length<T.npcs)HP.push([cx,cy]);
    for(let k=0;k<T.npcs;k++)npcs.push({vx:cx,vy:cy,vc:vi,n:NPC_NOMES[(hash(vi+1,k,s)*NPC_NOMES.length)|0],x:HP[k][0]*TS+3,y:HP[k][1]*TS+3,hx:HP[k][0]*TS+3,hy:HP[k][1]*TS+3,tx:0,ty:0,tm:0,f:1,fala:NPC_FALAS[(hash(vi+1,k+5,s)*NPC_FALAS.length)|0]});
  });
  VPEND={lj:VLJ,ch:VCH,cr:VCR,an:VAN};
  return m;
}
const _genV=gen;
gen=function(N,s){const m=_genV(N,s);npcs.length=0;return genVillages(m,N,s)};

// movimento simples dos NPCs, preso ao raio da vila
const _tickV=tick;
tick=function(){
  _tickV();
  if(!G||G.demo||G.layer)return;
  for(const p of npcs){
    if(--p.tm<=0){p.tm=(90+Math.random()*120)|0;const a=Math.random()*6.28,r=Math.random()*14;p.tx=p.hx+Math.cos(a)*r;p.ty=p.hy+Math.sin(a)*r}
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(d>1){const ox=p.x,oy=p.y;mv(p,dx/d*.3,dy/d*.3);p.f=dx>0?1:-1;p.w=Math.abs(p.x-ox)+Math.abs(p.y-oy)>.05}else p.w=false;
  }
};

// desenho: NPC com cor de pele/roupa, pelo mesmo sprite do jogador
const _extraV=extra;
extra=function(){
  _extraV();
  if(!G||G.layer)return;
  for(const p of npcs){
    const x=(p.x-CX)|0,y=(p.y-CY)|0;
    man(x,y,'#8a5a2b','#f1c27d',[p.f||1,1],false,false);
    g.textAlign='center';g.font='7px monospace';g.fillStyle='#000a';g.fillText(p.n,x+6,y-11);g.fillStyle='#fff';g.fillText(p.n,x+5,y-12);
  }
};

// interação: clicar/usar no NPC mostra a fala
const _actV=act1;
act1=function(){
  const cx=P.x+5,cy=P.y+5;
  for(const p of npcs){
    if(Math.hypot(p.x+5-(cx+fc[0]*12),p.y+5-(cy+fc[1]*12))<16){say(p.n+': '+p.fala,3000);sfx('click');return}
  }
  return _actV();
};
}

{const _beginVil=begin;begin=function(){
  if(G&&G.layer==null)G.layer=0;
  _beginVil();
  if(G&&VPEND){
    G.lj=G.lj||{};G.lj[0]=G.lj[0]||{};
    for(const [q,k] of VPEND.lj)G.lj[0][q]=k;
    G.ch=G.ch||{};
    for(const [q,items] of VPEND.ch)G.ch[(G.layer|0)+':'+q]=Object.assign({},items);
    G.cr=G.cr||{};
    for(const q of VPEND.cr)G.cr[q]=0;
    for(const a of VPEND.an)an.push(Object.assign({},a));
    VPEND=null;
  }}}

;{const _saveMob=save;save=function(){
  if(G&&P&&!G.demo){
    G.npcs=npcs.map(p=>Object.assign({},p));
    G.vanim=an.map(a=>Object.assign({},a));
  }
  return _saveMob()}}
;{const _beginMob=begin;begin=function(){
  const novo=!!(G&&VPEND);
  _beginMob();
  if(G&&!novo){
    npcs.length=0;
    for(const p of(G.npcs||[]))npcs.push(Object.assign({},p));
    if(G.vanim){an.length=0;for(const a of G.vanim)an.push(Object.assign({},a))}
  }}}
</script>
